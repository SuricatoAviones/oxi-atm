[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

# Los pines de dependencias ([workspace.dependencies]) se agregan junto con la
# fase que los usa (ROADMAP): fase 2 tokio/bytes en oxi-net, etc. Declararlos
# antes genera warnings de "unused workspace dependency" en este toolchain.

[workspace.dependencies]
thiserror = "2"
proptest = "1"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tracing = "0.1"

# Lints del workspace (skill rust-best-practices, Cap. 2): set curado.
# `cargo clippy -- -D warnings` los vuelve errores en cada tarea del DoD.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"

